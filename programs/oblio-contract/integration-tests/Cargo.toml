# Standalone workspace: litesvm pins solana-stake-interface ~4.3 while the program (anchor 1.2.x, solana-v4) needs >=4.4,
# so the black-box suite lives in its own dependency graph and talks to the compiled .so only.
[workspace]

[package]
name = "oblio-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
litesvm = "0.16.0"
solana-address = { version = "~2.6.1", features = ["curve25519", "std"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-instruction = "~3.4.0"
solana-transaction = "4.1.5"
solana-account = "4.3.0"
solana-clock = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-stake-interface = { version = "~4.3.0", features = ["bincode"] }
sha2 = "0.10"
bincode = "1.3"
solana-vote-interface = { version = "*", features = ["bincode"] }
solana-epoch-rewards = "3"
solana-epoch-schedule = "3"
solana-rent = "3"
